{% extends 'base.html' %}

{% block content %}
<div class="form-section" style="text-align: center;">
    <h1 style="color: var(--xmas-red);">Szeretnéd törölni a(z) "{{ object.name }}" ajándékot?</h1>
    <p>Ezt a műveletet nem lehet visszavonni.</p>
    
    <form action="." method="POST" style="display: inline-block; margin-top: 20px;">
        {% csrf_token %}
        <button type="submit" style="background-color: var(--xmas-red);">Igen, törlöm</button>
        <a href="../" style="margin-left: 15px; color: #555; text-decoration: none; font-weight: bold;">Mégsem</a>
    </form>
</div>
{% endblock %}
